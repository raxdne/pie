<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script type="text/javascript" src="myGanttChart.js"></script>
    <link rel="stylesheet" type="text/css" href="/pie/html/pie.css"/>
    <title>Dashboard Unit Tests</title>

    <script type="text/javascript">

      function test (index,strComment,strArg) {
        var b = document.getElementsByTagName('body')[0];
        var p = document.createElement('pre');
    
   	var t = document.createTextNode('TEST ' + index + ': "' + strComment + '" ' + strArg);
	p.appendChild(t);
	b.appendChild(p);
      }
    </script>
  </head>

  <body>
    <h1>Dashboard Unit Tests</h1>
    
    <script type="text/javascript">

      function UnitTests() {

	  var i = 0;

	  test(i++, 'ISO8601_parse', ISO8601_parse('2025-W02'));
	  
          var dt_0 = new Date('2024-12-01');
	  var dt_1 = new Date('2025-12-31');
	  var x = new objGanttChart('test',dt_0,dt_1,5);

	  test(i++, 'dt_0 == ', x.getBegin());

	  test(i++, 'dt_1 == ', x.getEnd());

	  test(i++, 'cleanup', typeof x.clean() === 'object');
    
	  test(i++, 'string', x.toString());
	  
	  test(i++, 'getDateOfIsoWeek', getDateOfIsoWeek(2,2025));
	  
	  
	  test(i++, 'grid', 1 + ' == ' + x.delta2grid(1000*60*60*24*7));
	  
	  test(i++, 'grid', x.date2grid(dt_1) + ' == ' + x.delta2grid(dt_1 - dt_0));
	  
	  //return;
	  test(i++, 'grid date', x.grid2date(x.date2grid(dt_1)));
	  
	  test(i++, 'grid', ' == ' + x.grid2date(x.delta2grid(9)));
	  
	  test(i++, 'grid delta', (dt_1 - dt_0) + ' == ' + x.grid2delta(x.delta2grid(dt_1 - dt_0)));
	  
	  test(i++, 'grid delta negative', (dt_0 - dt_1) + ' == ' + x.grid2delta(x.delta2grid(dt_0 - dt_1)));
      
	  x = new objGanttChart('test-' + i,dt_0, dt_1);
	  x.setBegin('2024-11-25'); // must be a Monday
	  for (var m = 0; m < 12; m++) {
	      x.append([{dt_0: new Date(2025,m,1), title: 'MS ' + (m+1)},{dt_0: new Date(2025,m,1), dt_1: new Date(2025,m+1,1), title: 'Month ' + (m+1)}]);
	  }
	  //x.setEnd('2025-03-31');
	  x.append([{dt_0: '2025-01-01', dt_1: '2025-12-31', title: 'Year 2025'}]);
	  // TODO: x.append({week_0: '2024-W03', week_1: '2024-W07', title: 'MS 1'});
	  x.append({dt_0: '2024-12-09', title: 'MS 1'});
	  x.append([{dt_0: '2025-02-02', dt_1: '2025-03-23', title: 'Bar 2'},{dt_0: '2025-02-09', title: 'MS 2'}]);
	  x.append({dt_0: '2024-12-01', dt_1: '2024-12-31', title: 'Bar v', vertical: true, fill: '#ff0000'});
	  x.draw();
	  test(i++, 'svg period + milestone', x.svg.outerHTML);

	  return;
      

      x = new objGanttChart('test-' + i);
      x.setBegin(dt_0);
      x.append([{dt_0: '2024-12-02', dt_1: '2024-12-23', title: 'Bar2'}]);
      x.append([{dt_0: '2024-12-23', title: 'MS2'}]);
      x.reDraw();
      test(i++, 'svg period + milestone', x.svg.outerHTML);
      //x.clean();

      test(i++, '', x.toStringS());
      }
      
      UnitTests();
      
    </script>
    <!--

2025-01-01;2025-01-22;P1
2025-01-22;;MS1
      -->
  </body>
</html>
