#
# cxproc template configuration
# 

# sudo a2enmod cgi actions

Define PIE_PORT 8181

Listen ${PIE_PORT}

<virtualhost *:${PIE_PORT}>
    # directory for pie, jQuery, ace etc
    Define WWW_PREFIX "C:/UserData/Develop/cxproc-build/x86-windows-debug/www/html"
    # directory for CGI binaries
    Define CGI_PREFIX "C:/UserData/Develop/cxproc-build/x86-windows-debug/www/cgi-bin"
    Define LOG_PREFIX "${WWW_PREFIX}/../log"
    # root directory of jQuery
    Define  JQ_PREFIX "${WWW_PREFIX}/code.jquery.com"

    # root directory of pie
    Define PIE_PREFIX "${WWW_PREFIX}/pie"
    # "${PIE_PREFIX}/doc" "${PIE_PREFIX}/examples" "${PIE_PREFIX}/test"
    Define PIE_ROOT "${WWW_PREFIX}/Documents"

    DocumentRoot "${PIE_ROOT}"

    # absolute path to PIE display directory
    SetEnv CXP_ROOT "${PIE_ROOT}/"
    #
    SetEnv CXP_PATH  "${PIE_PREFIX}/local/:${PIE_PREFIX}//"
    #SetEnv CXP_LOG     3
    #SetEnv CXP_READONLY "no"
    #SetEnv CXP_LOGFILE "${LOG_PREFIX}/cxproc-${PIE_PORT}.log"
    # relative path to backup directory
    SetEnv CXP_BACKUPS   Backup/
    # relative path to template directory
    SetEnv CXP_TEMPLATES Templates
    # default coordinate for sunrise/sunset time
    SetEnv CXP_COORDINATE "+4851+00221"
    #SetEnv CXP_DATE "1978"
    
    #
    # Content directory
    # - direct URL access via Apache
    # - Authorization
    # 
    <Directory "${WWW_PREFIX}">
	#htpasswd -c C:\User\passwords developer
	#AuthType Basic
	#AuthName "By Invitation Only"
	#AuthUserFile "C:/User/Starter/Settings/passwords"
	#Require valid-user 
        #Dav On
	Options Indexes FollowSymlinks
	#DirectoryIndex index.html
	Options All
	AllowOverride All
	#AllowOverride None
	#Require local
	Require all granted
        #Allow from all
	AddDefaultCharset off
    </Directory>

    Alias /favicon.ico		"${PIE_PREFIX}/html/favicon.ico"
    Alias /html/		"${PIE_PREFIX}/html/green/"

    Alias /pie/icons/		"${PIE_PREFIX}/browser-cgi/icons/"
    Alias /pie/js/		"${PIE_PREFIX}/browser-jquery/"
    Alias /pie/non-js/		"${PIE_PREFIX}/browser-cgi/"
    Alias /pie/			"${PIE_PREFIX}/"

    Alias /jquery/tablesorter/css/style.css "${WWW_PREFIX}/tablesorter-master/dist/css/theme.ice.min.css"
    Alias /jquery/tablesorter/		"${WWW_PREFIX}/tablesorter-master/dist/js/"
    Alias /jquery/contextMenu/		"${WWW_PREFIX}/jQuery-contextMenu-2.10.0/dist/"
    Alias /jquery/mobile/		"${JQ_PREFIX}/mobile/1.4.5/"
    Alias /jquery/jquery-ui/		"${JQ_PREFIX}/jquery-ui-1.14.2.custom/"
    Alias /jquery/			"${JQ_PREFIX}/"

    Alias /ace/js/		"${WWW_PREFIX}/ace-builds/src-min-noconflict/"

    Alias /impress/          	"${WWW_PREFIX}/impress.js/"

    Alias /d3/js/		"${WWW_PREFIX}/d3/"

    ScriptAlias /cxproc/exe	"${CGI_PREFIX}/cxproc-cgi.exe"
    Action cxp-process "/cxproc/exe"
    AddHandler cxp-process .cxp

    # default view 
    RedirectMatch "^/v/(.+)$"                "/cxproc/exe?cxp=PiejQDefault&redir=$1"
    # document view
    RedirectMatch "^/d/(.+)$"                "/cxproc/exe?cxp=PiejQFormat&redir=$1"
    # redirection
    RedirectMatch "^/r/(.+)$"                "/cxproc/exe?redir=$1"
    # search in pie
    RedirectMatch "^/s/(.+)$"                "/cxproc/exe?spath=$1"
    # specified views
    RedirectMatch "^/(Todo|Kanban|Backlog|GanttChart)/(.+)$" "/cxproc/exe?cxp=PiejQ$1&redir=$2"

    RedirectMatch "^/(Tag)/(.+)$"                "/cxproc/exe?path=Documents/Main.pie&cxp=PiejQDefault&pattern=child::*[contains(child::text(),'$2')]&hl=$2"

    RedirectMatch "^/(Date)/(.+)$"                "/cxproc/exe?path=Documents/Main.pie&cxp=PiejQDefault&pattern=child::date%5Bcontains(@iso,'$2')%5D&hl=$2"

    #RedirectMatch "^/(Test)/([0-9]{1,3})$"        "/cxproc/exe?path=Documents/Main.pie&cxp=PiejQDefault&pattern=ancestor::*%5Bdate%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%2015%5D%20or%20*%5Bdate%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%2015%5D%5D%5D%20or%20parent::*/descendant::date%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%2015%5D%20or%20parent::task%5B@class='target'%20and%20not(@done='yes')%5D"

    RedirectMatch "^/(Last)/([0-9]{1,3})$"   "/cxproc/exe?path=Documents/Main.pie&cxp=PiejQDefault&pattern=date%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%201%5D%20or%20t%5Bcontains%28text%28%29%2C%27%23today%27%29%5D"

    RedirectMatch "^/(Last)/([0-9]{1,3})/(.+)$"   "/cxproc/exe?path=Documents/Main.pie&cxp=PiejQDefault&pattern=child::*%5Bcontains(text(),'$3')%20and%20(ancestor::*%5Bdate%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%2015%5D%20or%20*%5Bdate%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%2015%5D%5D%5D%20or%20parent::*/descendant::date%5B@diff%20%3E%20-$2%20and%20@diff%20%3C%2015%5D%20or%20parent::task%5B@class='target'%20and%20not(@done='yes')%5D)%5D&hl=$3"

    RedirectMatch "^/(re)/(.+)$"                "/cxproc/exe?path=Documents/Main.pie&cxp=PiejQDefault&re=%5Cb$2%5Cb&hl=$2"
    #
    # Cxproc runtime and thirdparty Directory
    #
    <Directory "${CGI_PREFIX}">
	Options Indexes FollowSymlinks
	DirectoryIndex index.html
	Options All
	AllowOverride All
	#Require local
	Require all granted
	#AllowOverride None
	#Order allow,deny
	#Allow from all
	AddDefaultCharset off
    </Directory>

    <Location /server-status>
	SetHandler server-status
	Require local
    </Location>

    ErrorLog "${LOG_PREFIX}/cxproc-${PIE_PORT}-error.log"
    LogLevel warn
    CustomLog "${LOG_PREFIX}/cxproc-${PIE_PORT}-access.log" combined

    ScriptLog "${LOG_PREFIX}/cxproc-${PIE_PORT}-cgi.log"
    #ScriptLogBuffer 10385760

</virtualhost>
